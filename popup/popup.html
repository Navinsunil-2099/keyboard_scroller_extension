<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrollith Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- Minimal Header -->
  <header class="popup-header">
    <div class="brand-row">
      <div class="brand-icon-box">
        <div class="brand-icon-inner">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M7 8L12 3.5L17 8" stroke="#fe8019" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="12" r="1.5" fill="#fbf1c7"/>
            <path d="M7 16L12 20.5L17 16" stroke="#fe8019" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
      <div>
        <div class="brand-title">Scroll<span>ith</span> <span class="brand-ver">v1.2.0</span></div>
        <div class="brand-subtitle">FAST SCROLLER</div>
      </div>
    </div>

    <div class="header-controls">
      <!-- Settings Icon Button (More Settings) -->
      <button type="button" class="settings-gear-btn" id="open-settings-icon-btn" title="More Settings (Open Full Dashboard)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>

      <!-- Master Power Switch -->
      <label class="switch-label" title="Master Toggle On/Off">
        <input type="checkbox" id="master-toggle" class="switch-input" checked>
        <div class="switch-track">
          <div class="switch-thumb"></div>
        </div>
      </label>
    </div>
  </header>

  <!-- Current Site Banner -->
  <div class="site-bar" id="site-banner">
    <div class="site-bar-left">
      <span class="status-dot" id="site-status-dot"></span>
      <span class="site-domain-text" id="current-domain">Detecting tab...</span>
    </div>
    <button type="button" class="site-action-btn" id="site-toggle-btn">Exclude Site</button>
  </div>

  <!-- Quick Key Status Summary -->
  <div class="quick-deck">
    <!-- Scroll Keys Summary -->
    <div class="quick-card">
      <div class="quick-card-title">
        <span>Scroll Keys</span>
        <span class="key-arrow-tag">▲▼</span>
      </div>
      <div class="quick-keys-row">
        <span class="keycap-mini" id="mini-key-up">G</span>
        <span class="keycap-mini" id="mini-key-down">H</span>
      </div>
      <div class="quick-subtext">Typing: Alt+G / Alt+H</div>
    </div>

    <!-- Tab Switching Summary -->
    <div class="quick-card">
      <div class="quick-card-title">
        <span>Tabs (Alt+U/I)</span>
        <span class="key-arrow-tag aqua">◀▶</span>
      </div>
      <div class="quick-keys-row">
        <span class="keycap-mini combo">Alt+U</span>
        <span class="keycap-mini combo">Alt+I</span>
      </div>
      <div class="quick-subtext">Switch Left / Right</div>
    </div>
  </div>

  <!-- Quick Scroll Step Slider -->
  <div class="slider-container">
    <div class="slider-header">
      <span class="slider-label">Scroll Distance</span>
      <span class="slider-badge" id="step-size-val">120 px</span>
    </div>
    <input type="range" id="step-size" min="40" max="300" step="10" value="120">
  </div>

  <!-- Prominent "More Settings" Action Button -->
  <button type="button" class="more-settings-card-btn" id="open-options-card-btn">
    <div class="more-settings-left">
      <div class="gear-icon-badge">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </div>
      <div>
        <div class="more-settings-title">More Settings & Detailed Options ⚙</div>
        <div class="more-settings-sub">Key rebinding, dev conflict manager & sandbox</div>
      </div>
    </div>
    <span class="arrow-external">↗</span>
  </button>

  <!-- Minimal Footer -->
  <footer class="popup-footer">
    <span>Safe typing protection</span>
    <span style="color: var(--gb-fg2);">Tactile Gruvbox</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
