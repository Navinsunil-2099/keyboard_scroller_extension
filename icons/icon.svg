<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.28)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.12)" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="128" height="128" rx="28" fill="url(#grad)" filter="url(#shadow)" />
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5" />

  <!-- Top Key: 'I' (Up) -->
  <g id="key-i">
    <rect x="20" y="16" width="88" height="42" rx="10" fill="url(#keyGrad)" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.5" />
    <path d="M64 25 L76 39 H52 Z" fill="#FFFFFF" />
    <text x="32" y="43" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" opacity="0.9">I</text>
  </g>

  <!-- Bottom Key: 'U' (Down) -->
  <g id="key-u">
    <rect x="20" y="70" width="88" height="42" rx="10" fill="url(#keyGrad)" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.5" />
    <path d="M64 103 L52 89 H76 Z" fill="#FFFFFF" />
    <text x="32" y="97" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" opacity="0.9">U</text>
  </g>
</svg>
