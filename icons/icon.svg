<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Outer rim / bevel gradient -->
    <linearGradient id="outerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242628" />
      <stop offset="100%" stop-color="#141516" />
    </linearGradient>

    <!-- Inset panel gradient -->
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1d1e" />
      <stop offset="100%" stop-color="#121314" />
    </linearGradient>

    <!-- Amber chevron gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fabd2f" />
      <stop offset="100%" stop-color="#fe8019" />
    </linearGradient>

    <!-- Amber Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Outer squircle base -->
  <rect x="5" y="5" width="118" height="118" rx="28" fill="url(#outerGrad)" stroke="#383b3d" stroke-width="1.8" />
  <rect x="6" y="6" width="116" height="116" rx="27" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- 2. Inset recessed keycap / panel -->
  <rect x="25" y="25" width="78" height="78" rx="20" fill="url(#innerGrad)" stroke="#2d3032" stroke-width="1.6" />
  <rect x="26" y="26" width="76" height="76" rx="19" fill="none" stroke="rgba(0, 0, 0, 0.45)" stroke-width="1" />

  <!-- 3. Indicator dots -->
  <circle cx="36" cy="36" r="2.2" fill="#d5c4a1" opacity="0.85" />
  <circle cx="92" cy="36" r="2.2" fill="#fe8019" filter="drop-shadow(0 0 2px #fe8019)" />

  <!-- 4. Glowing Amber Chevrons -->
  <g filter="url(#glow)">
    <!-- Up chevron -->
    <path d="M47 56 L64 43 L81 56" fill="none" stroke="url(#amberGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Down chevron -->
    <path d="M47 72 L64 85 L81 72" fill="none" stroke="url(#amberGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 5. Center dot -->
  <circle cx="64" cy="64" r="4.2" fill="#fbf1c7" />
</svg>
